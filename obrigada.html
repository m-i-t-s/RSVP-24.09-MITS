<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffede1" />
  <title>Presença confirmada — MITS</title>
  <style>
    :root { --offwhite:#ffede1; --brown:#1b140f; --orange:#ef5423; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--offwhite); color:var(--brown); font-family:Arial,Helvetica,sans-serif; }
    main { width:min(560px,100%); border:2px solid var(--brown); padding:32px; box-shadow:8px 8px 0 var(--brown); }
    h1 { margin:0 0 12px; font-size:clamp(32px,8vw,54px); line-height:.95; text-transform:uppercase; }
    p { margin:0 0 24px; font-size:18px; }
    a { display:inline-block; background:var(--orange); color:var(--offwhite); padding:14px 18px; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <main>
    <h1>Presença confirmada</h1>
    <p>Obrigada. Sua resposta foi registrada.</p>
    <a href="/">Voltar</a>
  </main>
</body>
</html>
