<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff4b00" />
  <meta name="description" content="RSVP — COORDENADAS → IMPROVÁVEIS, MITS Galeria" />
  <title>RSVP — Coordenadas → Improváveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="poster-panel" aria-label="Convite da exposição">
      <img src="assets/convite.png" alt="Convite da exposição Coordenadas → Improváveis" class="poster-image" />
    </section>

    <section class="rsvp-panel" aria-labelledby="rsvp-title">
      <div class="rsvp-card">
        <header class="brand-block">
          <div class="eyebrow">MITS GALERIA</div>
          <h1 id="rsvp-title">COORDENADAS<br><span>→ IMPROVÁVEIS</span></h1>
        </header>

        <div class="event-meta" aria-label="Informações do evento">
          <div><strong>24.09</strong><span>quinta</span></div>
          <div><strong>18H</strong><span>abertura</span></div>
          <div class="event-address"><strong>AL. TIETÊ, 618</strong><span>CASA 7 · SÃO PAULO</span></div>
        </div>

        <div class="question-block" id="questionBlock">
          <p class="hello" id="hello">Olá!</p>
          <p class="question">Podemos contar com sua presença?</p>

          <div class="fallback-name" id="fallbackName" hidden>
            <label for="nameInput">Seu nome</label>
            <input id="nameInput" name="nome" type="text" autocomplete="name" placeholder="Digite seu nome" />
          </div>

          <div class="actions" role="group" aria-label="Confirmação de presença">
            <button type="button" class="btn btn-primary" data-response="SIM">
              SIM, ESTAREI LÁ
              <span aria-hidden="true">↘</span>
            </button>
            <button type="button" class="btn btn-secondary" data-response="NÃO">
              NÃO VOU CONSEGUIR
            </button>
          </div>

          <p class="microcopy">Leva menos de 2 segundos. Sem formulário.</p>
        </div>

        <div class="success-block" id="successBlock" hidden aria-live="polite">
          <div class="stamp">RSVP</div>
          <h2 id="successTitle">PRESENÇA CONFIRMADA</h2>
          <p id="successText">Nos vemos dia 24.09, às 18h.</p>
          <button type="button" class="text-button" id="changeAnswer">alterar resposta</button>
        </div>

        <footer>
          <div class="footer-line"></div>
          <p>Curadoria de <strong>Steve Coimbra</strong></p>
        </footer>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
