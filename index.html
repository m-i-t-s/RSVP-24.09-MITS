<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fde3d5" />
  <meta name="description" content="RSVP — Coordenadas Improváveis, MITS Galeria" />
  <title>RSVP — Coordenadas Improváveis</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="stage" id="stage" aria-label="RSVP Coordenadas Improváveis">
      <form id="rsvpForm" class="rsvp-form" novalidate>
        <label class="sr-only" for="nameInput">Nome</label>
        <input class="overlay-input input-name" id="nameInput" name="nome" type="text" autocomplete="name" required aria-label="Nome" />

        <label class="sr-only" for="phoneInput">Telefone</label>
        <input class="overlay-input input-phone" id="phoneInput" name="telefone" type="tel" autocomplete="tel" aria-label="Telefone" />

        <label class="sr-only" for="emailInput">Email</label>
        <input class="overlay-input input-email" id="emailInput" name="email" type="email" autocomplete="email" aria-label="Email" />

        <button class="hit-button button-yes" type="button" data-response="SIM" aria-label="Sim, estarei lá"></button>
        <button class="hit-button button-no" type="button" data-response="NÃO" aria-label="Desculpe, não poderei ir"></button>
      </form>

      <section class="confirmation" id="confirmation" hidden aria-live="polite">
        <div class="confirmation-title">RSVP</div>
        <div class="confirmation-content">
          <h1 id="confirmationHeading">PRESENÇA<br>CONFIRMADA.</h1>
          <p id="confirmationText"></p>
          <button type="button" id="changeAnswer" class="change-answer">ALTERAR RESPOSTA</button>
        </div>
      </section>
    </section>

    <div class="poster-mobile" aria-hidden="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
